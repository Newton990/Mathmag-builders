root = "/public"
# SPA fallback: React Router handles all routes — unknown paths serve index.html
page-fallback = "/public/index.html"

# ---------------------------------------------------------------------------
# Security headers — applied to every response by static-web-server
# ---------------------------------------------------------------------------
[[headers]]
source = "**"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Hashed JS/CSS assets from Vite — cache one year (content-addressed)
[[headers]]
source = "/assets/**"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# HTML entry point — always revalidate so users get the latest app shell
[[headers]]
source = "/*.html"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
