kind: wasmer.io/App.v0
name: node-base-newton-pg
owner: newton
package: .
annotations:
  anybuild.run/config:
    commands:
      start: node server.js
    edgejs_enable: true
    edgejs_precompile: true
    name: out
    node_build_command: node -e "console.log('Prebuilt')"
    node_install_inputs:
    - package.json
    - apps/api/package.json
    - apps/web/package.json
    - packages/shared/package.json
    node_install_requires_all_files: true
    node_package_manager: npm
    node_package_name: mathmag-mbms
    node_remove_native_binaries: true
    node_server: node
    npm_version: '11'
  anybuild.run/provider: node
