[package]
name = "mbms/web"
version = "1.0.0"
description = "Mathmag MBMS — React/Vite Frontend"

[dependencies]
"wasmer/static-web-server" = "^2"

[fs]
"/public" = "dist"

[[command]]
name = "web"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
env = ["PORT=8080", "SERVER_LOG_LEVEL=info"]
