[package]
name = "mathmag/mbms-web"
version = "1.0.0"
description = "Mathmag MBMS – React SPA served via static-web-server"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
# Anybuild runs `npm run build` → outputs to apps/web/dist
# static-web-server picks it up from /public inside the container
"/public" = "apps/web/dist"
"/config" = "settings"

[[command]]
name = "server"
module = "wasmer/static-web-server:webserver"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
env = [
  "SERVER_CONFIG_FILE=/config/config.toml",
  "SERVER_PORT=8080",
  "SERVER_LOG_LEVEL=info",
]
