[package]
# Replace "mathmag" with your actual Wasmer username before deploying
name = "mathmag/mbms"
version = "1.0.0"
description = "Mathmag MBMS monorepo – deploy from apps/web with: wasmer deploy (run from apps/web/)"

# ──────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT INSTRUCTIONS
# ──────────────────────────────────────────────────────────────────────────────
# This root wasmer.toml is a placeholder/reference.
# The actual deployable package lives in apps/web/wasmer.toml.
#
# To deploy:
#   1. npm run build                 (builds apps/web/dist)
#   2. cd apps/web
#   3. wasmer login                  (once, with your Wasmer account)
#   4. wasmer deploy                 (deploys to Wasmer Edge)
#
# To test locally before deploying:
#   cd apps/web
#   wasmer run . -- --port 9000
#   open http://localhost:9000
# ──────────────────────────────────────────────────────────────────────────────
