[package]
name = "mathmag/mbms"
version = "1.0.0"
description = "Mathmag MBMS unified web application"
entrypoint = "server"

[dependencies]
"wasmer/node" = "^20"

[[command]]
name = "server"
module = "wasmer/node:node"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/server.js"]
env = ["PORT=8080", "MBMS_PUBLIC_DIR=/public"]

[fs]
"/app/server.js" = "server.js"
"/app/apps/api/dist" = "apps/api/dist"
"/app/node_modules" = "apps/api/wasmer-runtime/node_modules"
"/public" = "public"
